<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder & Sister Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Sister Tiffany Savage-Humphreys</td>
            <td>Trust the God Who Knows the Ending</td>
            <td>BYU-Idaho</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder Wilcox</td>
            <td>His Grace Is Sufficient</td>
            <td>BYU</td>
            <td>2011</td>
          </tr>
        </table>

        <section>
          <h2>Add a New Devotional</h2>
          <form>
            <div>
              <label for="speaker">Speaker:</label>
              <input type="text" id="speaker" name="speaker">
            </div>
            
            <div>
              <label for="title">Title:</label>
              <input type="text" id="title" name="title">
            </div>
            
            <div>
              <label for="location">Location:</label>
              <input type="text" id="location" name="location">
            </div>
            
            <div>
              <label for="year">Year:</label>
              <input type="number" id="year" name="year">
            </div>

            <button type="submit">Add Devotional</button>
          </form>
        </section>

      </div>
    </main>
  </div>
</body>
</html>
